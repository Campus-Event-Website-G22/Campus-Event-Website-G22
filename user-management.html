<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Campus Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f7f9fc; color: #14213d; font-family: Inter, sans-serif; overflow-x: hidden; }
    #menu { position: absolute; opacity: 0; pointer-events: none; }
    #sidebar { transform: translateX(-110%); transition: transform .25s ease; }
    body:has(#menu:checked) #sidebar { transform: translateX(0); }
    #overlay { display: none; }
    body:has(#menu:checked) #overlay { display: block; }
    .khmer { display: none; }
    .blue-button { background: #0052cc; transition: background .2s ease; }
    .blue-button:hover { background: #0043a8; }
    @media (min-width: 768px) { #sidebar { transform: translateX(0); position: sticky; } #overlay { display: none !important; } }
  </style>
</head>
<body>
  <input type="checkbox" id="menu">
  <div class="min-h-screen flex flex-col">
    <header class="h-[68px] sm:h-[76px] bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="h-full px-3 sm:px-6 lg:px-8 flex items-center gap-2 sm:gap-4">
        <label for="menu" class="md:hidden cursor-pointer p-2 rounded-lg hover:bg-gray-100 shrink-0" aria-label="Open navigation menu"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></label>
        <a href="index.html" class="flex items-center shrink-0" aria-label="CampusPulse Student Community"><img src="/campus-pulse-logo.svg" alt="CampusPulse Student Community" class="h-12 sm:h-14 w-auto"></a>
        <a id="auth-login-link" href="index.html#view-login" class="blue-button text-white ml-auto px-3.5 sm:px-6 py-2 sm:py-2.5 rounded-full text-xs sm:text-sm font-semibold whitespace-nowrap">Log In</a>
      </div>
    </header>
    <div class="flex flex-1">
      <div id="sidebar-mount"></div>
      <div class="flex flex-1 min-w-0 flex-col">
      <main class="flex-1 min-w-0 w-full max-w-4xl mx-auto p-4 sm:p-6">
    <div class="bg-white border border-gray-200 rounded-2xl p-5 sm:p-6 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6"><div><h1 class="text-2xl font-bold">User Management</h1><p class="text-sm text-gray-500 mt-1">Review registered users and reset passwords when needed.</p></div><div class="bg-blue-50 border border-blue-100 rounded-xl px-5 py-3 text-center"><p class="text-2xl font-bold text-blue-700" id="registered-user-count">0</p><p class="text-xs font-semibold text-blue-700">Registered Users</p></div></div>
      <div id="registered-users-list" class="space-y-3"></div><p id="registered-users-empty" class="hidden text-sm text-gray-500 text-center py-8">No users have registered yet.</p>
    </div>
      </main>
      <div id="site-footer-mount" class="w-full"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
